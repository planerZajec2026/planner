name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      # Spec 13: the pages read everything from the database, so e2e runs against a local Supabase (API only: Postgres,
      # PostgREST and the gateway). Its seed loads the input data; the e2e global setup adds a finished plan.
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api,gotrue,supavisor
      - run: npm run db:env
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Spec 08: the schema builds from scratch, its tests pass, and generated files are current.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Only Postgres is needed; the CLI version is the one pinned in package.json.
      - run: npx supabase db start
      - run: npx supabase db reset --local
      - run: npm run db:test
      - run: npx supabase db lint --local --level warning --fail-on warning
      - name: Security advisors
        # Each finding also becomes an annotation, so it shows on the PR without opening the log.
        run: |
          if ! npx supabase db advisors --local --type security --fail-on warn --output-format json > advisors.json; then
            cat advisors.json
            python3 - <<'PY'
          import json
          raw = open("advisors.json").read()
          try:
              data = json.loads(raw)
          except ValueError:
              data = None
          items = data if isinstance(data, list) else (data or {}).get("results") or []
          if not items:
              print("::error title=Supabase security advisors::" + " ".join(raw.split())[:900])
          for item in items:
              name = item.get("name") or item.get("title") or "advisor"
              detail = item.get("detail") or item.get("description") or json.dumps(item)
              print(f"::error title=Supabase advisor: {name}::{' '.join(str(detail).split())[:900]}")
          PY
            exit 1
          fi
      - name: Generated types, mock data and seed are up to date
        run: |
          npm run db:types
          npm run db:mock:generate
          npm run db:seed:generate
          # porcelain also catches a file that is missing from the commit (git diff ignores untracked files)
          files="src/lib/supabase/database.types.ts src/lib/mock-data.ts supabase/seed.sql"
          changed="$(git status --porcelain -- $files)"
          if [ -n "$changed" ]; then
            echo "$changed"; git diff -- $files
            echo "::error title=Generated files are stale::Run npm run db:types, npm run db:mock:generate and npm run db:seed:generate, then commit the result."
            exit 1
          fi

  # Spec 13: the timetable solver (OR-Tools CP-SAT) and its validator.
  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: solver/requirements*.txt
      - run: pip install -r solver/requirements.txt -r solver/requirements-dev.txt
      # The tests that need a database are opt-in (RUN_DB_TESTS) and stay off here.
      - run: python -m pytest solver/tests -q
